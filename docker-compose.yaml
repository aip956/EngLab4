services:
  
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.1
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - kafka_network

  kafka:
    image: confluentinc/cp-kafka:7.4.1
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - kafka_network

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/code
    ports:
      - "8008:8000"
    depends_on:
      - kafka
    environment:
      PYTHONPATH: /code
      KAFKA_BOOTSTRAP_SERVER: "kafka:9092"
    networks:
      - kafka_network

  web:
    image: nginx:latest
    container_name: web_server
    ports:
      - "8080:8000"
    volumes:
      - ./web:/usr/share/nginx/html
    networks:
      - kafka_network

  consumer:
    build: ./consumer
    container_name: consumer
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP_SERVER: "kafka:9092"
    volumes:
      - ./consumer:/app
    networks:
      - kafka_network

  producer:
    build: ./producer
    container_name: producer
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP_SERVER: "kafka:9092"
    volumes:
      - ./producer:/app
    networks:
      - kafka_network

networks:
  kafka_network:
    driver: bridge