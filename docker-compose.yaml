
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.1
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - kafka_network

  kafka:
    image: confluentinc/cp-kafka:7.4.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - kafka_network

  api:
    build: .
    container_name: api
    # command: python main.py  # Running main.py as specified in your Dockerfile
    volumes:
      - .:/app
    ports:
      - "8008:8000"
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP_SERVER: "kafka:9092"
    networks:
      - kafka_network

  web:
    image: nginx:latest
    container_name: web_server
    ports:
      - "8080:8000"
    volumes:
      - ./web:/usr/share/nginx/html
    networks:
      - kafka_network

  consumer:
    build: .
    container_name: consumer
    command: python consumer/consume_events.py  # Run consumer logic
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP_SERVER: "kafka:9092"
    volumes:
      - .:/app
    networks:
      - kafka_network

  producer:
    build: .
    container_name: producer
    command: python producer/produce_events.py  # Run producer logic
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP_SERVER: "kafka:9092"
    volumes:
      - .:/app
    networks:
      - kafka_network

networks:
  kafka_network:
    driver: bridge
